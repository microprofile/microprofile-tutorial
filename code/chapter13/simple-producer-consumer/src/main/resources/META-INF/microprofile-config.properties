# ===========================================================================
# MicroProfile Reactive Messaging Configuration
# ===========================================================================
# Channels used in SimpleMessageBean:
#
#   greetings-in  : produce()  [@Outgoing] ---> process() [@Incoming]
#   greetings-out : process()  [@Outgoing] ---> consume() [@Incoming]
#
# This project uses in-memory channels: both the producer and consumer of
# each channel live in the same application. MicroProfile Reactive Messaging
# automatically connects @Outgoing and @Incoming that share the same channel
# name within the same application with no broker or connector required.
#
# NOTE on Kafka: adding both an outgoing AND an incoming connector to the
# same channel name (e.g. mp.messaging.outgoing.greetings-in +
# mp.messaging.incoming.greetings-in) will trigger a deployment failure 
# at startup (SRMSG00073) because
# MicroProfile Reactive Messaging forbids a channel from being both an
# external outbound and an external inbound endpoint at the same time.
# Kafka connectors are designed for cross-application boundaries where one
# app owns the @Outgoing side and a separate app owns the @Incoming side.
# See the order/payment projects for a multi-app Kafka example.
# ===========================================================================
