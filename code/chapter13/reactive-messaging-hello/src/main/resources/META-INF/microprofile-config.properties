# ===========================================================================
# MicroProfile Reactive Messaging Configuration
# ===========================================================================
# Channel layout in this application:
#
#   Emitter  @Channel("hello-in")  ──▶  [transport]  ──▶  @Incoming("hello-out")
#   HelloPublisher                                          HelloConsumer
#
# The Emitter publishes to channel "hello-in".
# The consumer subscribes on channel "hello-out".
# Both channels map to the same Kafka topic (hello-topic) in Kafka mode,
# or are bridged in-memory when no connectors are configured.
#
# IMPORTANT — why different channel names are used for Emitter and @Incoming:
#   Assigning an outgoing connector to "hello-in" AND an incoming connector
#   to "hello-in" at the same time triggers SRMSG00073 at startup. MicroProfile
#   Reactive Messaging does not allow a single channel name to be both an
#   external outbound and an external inbound endpoint. Using "hello-in" for
#   the Emitter (outgoing) and "hello-out" for the consumer (incoming), both
#   pointing to the same Kafka topic, avoids the conflict.
#
# Switching modes
# ---------------
# KAFKA  (default below): ensure Kafka is running and all lines are active.
# IN-MEMORY              : comment out all mp.messaging.* lines; also change
#                          @Incoming("hello-out") back to @Incoming("hello-in")
#                          in HelloConsumer.java so the Emitter and consumer
#                          share the same channel name for auto-wiring.
# ===========================================================================

# ---------------------------------------------------------------------------
# Kafka mode
# ---------------------------------------------------------------------------
mp.messaging.connector.liberty-kafka.bootstrap.servers=localhost:9092

# Emitter -> hello-in -> Kafka topic "hello-topic"
mp.messaging.outgoing.hello-in.connector=liberty-kafka
mp.messaging.outgoing.hello-in.topic=hello-topic
mp.messaging.outgoing.hello-in.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.hello-in.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka topic "hello-topic" -> hello-out -> HelloConsumer
mp.messaging.incoming.hello-out.connector=liberty-kafka
mp.messaging.incoming.hello-out.topic=hello-topic
mp.messaging.incoming.hello-out.group.id=hello-consumer-group
mp.messaging.incoming.hello-out.auto.offset.reset=earliest
mp.messaging.incoming.hello-out.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.hello-out.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ---------------------------------------------------------------------------
